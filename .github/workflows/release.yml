name: Release YT Morphe

on:
  workflow_dispatch:
    inputs:
      patches:
        description: "Morphe patches"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - dev
      patches_source:
        description: "Test only: patches from a branch, as owner/repo@branch (empty: Morphe patches above)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the release (unchecked: test build in Artifacts only)"
        required: false
        default: true
        type: boolean
      update_preview:
        description: "Test only: the build offers the latest release, to preview the update dialog"
        required: false
        default: false
        type: boolean
      r2_test:
        description: "Test only: upload the test build to R2 as test files, the build checks those (use with update preview)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  YAVOT_REPO: sashade8-ship-it/morphe-patches-yavot
  APP_TITLE: YT Morphe
  APP_NAME: YouTube
  STRIPLIBS: arm64-v8a
  FORUM_URL: ""   # 4PDA topic URL
  # APKs and update info on Cloudflare R2, served by cloudflare/worker.js (required to publish)
  DL_BASE_URL: ${{ vars.DL_BASE_URL }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve patches version
        env:
          CHANNEL: ${{ inputs.patches }}
          SOURCE: ${{ inputs.patches_source }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$SOURCE" ]; then
            # A branch of a fork is only built for testing, never published
            [ "$PUBLISH" != "true" ] || { echo "::error::A patches branch is for test builds only. Uncheck 'Publish the release'."; exit 1; }
            echo "PATCHES_REPO=${SOURCE%@*}" >> "$GITHUB_ENV"
            echo "PATCHES_TAG=${SOURCE#*@}" >> "$GITHUB_ENV"
            echo "Patches: $SOURCE"
            exit 0
          fi
          case "$CHANNEL" in
            stable) TAG=$(gh api "repos/$PATCHES_REPO/releases/latest" -q .tag_name) ;;
            dev)    TAG=$(gh api "repos/$PATCHES_REPO/releases?per_page=30" -q '[.[] | select(.prerelease and (.draft | not))][0].tag_name') ;;
            *)         TAG=$(gh api "repos/$PATCHES_REPO/releases/tags/$CHANNEL" -q .tag_name) ;;
          esac
          [ -n "$TAG" ] && [ "$TAG" != null ] || { echo "::error::Patches version '$CHANNEL' not found"; exit 1; }
          echo "Patches: $TAG"
          echo "PATCHES_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PATCHES_VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout patches
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PATCHES_REPO }}
          ref: ${{ env.PATCHES_TAG }}
          path: patches-src

      - name: Read patches version
        if: ${{ inputs.patches_source != '' }}
        run: |
          VER=$(sed -n 's/^version *= *//p' patches-src/gradle.properties)
          echo "Patches version: $VER"
          echo "PATCHES_VER=$VER" >> "$GITHUB_ENV"

      - name: Generate changelog
        run: |
          # YouTube part of the Morphe changelog: a stable version lists its own section,
          # a dev version the new features of itself (and of the previous dev if that one was
          # not released here), and its own fixes followed by the fixes of the mod
          # (notes/mod-fixes.md). Changes keep the order of the Morphe changelog.
          # Patches versions that already have a release: tags v<yt>-p<patches>-b<build>
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | sed -n 's/^v[^-]*-p\(.*\)-b[0-9]*$/\1/p' > "$RUNNER_TEMP/released.txt"
          echo "Released patches versions: $(tr '\n' ' ' < "$RUNNER_TEMP/released.txt")"
          python3 -I scripts/changelog.py patches-src/CHANGELOG.md "$PATCHES_VER" \
            "$RUNNER_TEMP/changes.md" "$RUNNER_TEMP/changes.txt" \
            --mod-features notes/mod-features.md --mod-fixes notes/mod-fixes.md \
            --extra-features notes/extra-features.md --released "$RUNNER_TEMP/released.txt"
          cat "$RUNNER_TEMP/changes.txt"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches (official + extras)
        working-directory: patches-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Additional patches and code from extras/ are added to the official ones.
          # Extras only add files: the official Morphe files are never replaced.
          clash=0
          for dir in patches extensions; do
            while IFS= read -r -d '' f; do
              rel=${f#"$GITHUB_WORKSPACE/extras/$dir/"}
              if [ -e "$dir/$rel" ]; then
                echo "::error::extras/$dir/$rel would replace an official Morphe file"
                clash=1
              fi
            done < <(find "$GITHUB_WORKSPACE/extras/$dir" -type f -print0)
          done
          [ "$clash" -eq 0 ] || exit 1
          cp -rv "$GITHUB_WORKSPACE"/extras/patches/. patches/
          cp -rv "$GITHUB_WORKSPACE"/extras/extensions/. extensions/
          # Strings and arrays from extras/strings/<locale>/{strings,arrays}.xml are appended to the YouTube ones
          for src in "$GITHUB_WORKSPACE"/extras/strings/*/strings.xml "$GITHUB_WORKSPACE"/extras/strings/*/arrays.xml; do
            [ -f "$src" ] || continue
            loc=$(basename "$(dirname "$src")")
            dst="patches/src/main/resources/addresources/$loc/youtube/$(basename "$src")"
            [ -f "$dst" ] || { echo "::error::Strings file $dst not found"; exit 1; }
            python3 - "$src" "$dst" <<'PY'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          extra = open(src, encoding="utf-8").read()
          text = open(dst, encoding="utf-8").read()
          i = text.rindex("</resources>")
          open(dst, "w", encoding="utf-8").write(text[:i] + extra + text[i:])
          PY
            echo "Added: $loc/$(basename "$src")"
          done
          ./gradlew :patches:buildAndroid --no-daemon
          cp patches/build/libs/patches-*.mpp "$RUNNER_TEMP/patches.mpp"

      - name: Build YaVoT add-on
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The latest YaVoT release is built from source with the fixes in addons/yavot/.
          # Its own release workflow pins the Morphe host it compiles against; the same commits are used here.
          TAG=$(gh api "repos/$YAVOT_REPO/releases/latest" -q .tag_name)
          echo "YaVoT: $TAG"
          echo "YAVOT_TAG=$TAG" >> "$GITHUB_ENV"
          WORK="$RUNNER_TEMP/yavot-build"
          mkdir -p "$WORK"
          git clone -q --depth 1 -b "$TAG" "https://github.com/$YAVOT_REPO" "$WORK/morphe-patches-yavot"
          WF="$WORK/morphe-patches-yavot/.github/workflows/release.yml"
          for repo in morphe-patches morphe-patcher morphe-patches-library; do
            ref=$(awk -v r="repository: MorpheApp/$repo" '$0 ~ r"$" {f=1; next} f && /^ *ref:/ {sub(/.*ref: */, ""); print; exit}' "$WF")
            [ -n "$ref" ] || { echo "::error::YaVoT build ref for $repo not found"; exit 1; }
            echo "$repo: $ref"
            git init -q "$WORK/$repo"
            git -C "$WORK/$repo" fetch -q --depth 1 "https://github.com/MorpheApp/$repo" "$ref"
            git -C "$WORK/$repo" checkout -q FETCH_HEAD
          done
          cd "$WORK/morphe-patches-yavot"
          for f in "$GITHUB_WORKSPACE"/addons/yavot/*.patch; do
            if git apply --check "$f" 2>/dev/null; then
              git apply "$f"
              echo "Applied: $(basename "$f")"
            elif git apply --check -R "$f" 2>/dev/null; then
              echo "::notice::$(basename "$f") is already in YaVoT $TAG, skipped"
            else
              echo "::error::$(basename "$f") no longer applies to YaVoT $TAG"
              exit 1
            fi
          done
          # Morphe 1.49.0-dev.7+ changed Event.addObserver; no direct Kotlin Function1 observers may remain
          if grep -rn "getOnChange().addObserver(" extensions --include=*.java | grep -v callPlayerTypeEvent; then
            echo "::error::YaVoT $TAG still uses the old Event observer API"
            exit 1
          fi
          (cd "$WORK/morphe-patches" && ./gradlew :extensions:youtube:compileReleaseKotlin \
            :extensions:youtube:compileReleaseJavaWithJavac --no-daemon)
          ./gradlew :patches:buildAndroid --no-daemon
          ls patches/build/libs/
          cp patches/build/libs/patches-*.mpp "$RUNNER_TEMP/yavot.mpp"

      - name: Download Morphe CLI
        run: |
          gh release download -R MorpheApp/morphe-cli -p 'morphe-desktop-*-all.jar' -D "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP"/cli/*.jar "$RUNNER_TEMP/morphe-cli.jar"

      - name: Download source APK
        run: |
          # The original APK is attached to the hidden draft release "source".
          # If there are several, the newest version is used.
          mapfile -t URLS < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.tag_name=="source") | .assets[] | select(.name|endswith(".apk")) | .url')
          [ "${#URLS[@]}" -gt 0 ] || { echo "::error::No APK in the source release"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/src"
          SRC="" VER="" CODE=-1
          for i in "${!URLS[@]}"; do
            f="$RUNNER_TEMP/src/youtube-$i.apk"
            gh api -H "Accept: application/octet-stream" "${URLS[$i]}" > "$f"
            badging=$("$AAPT" dump badging "$f" | head -1)
            v=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
            c=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
            echo "Found APK: $v ($c)"
            if [ "${c:-0}" -gt "$CODE" ]; then
              SRC=$f; VER=$v; CODE=$c
            fi
          done
          [ -n "$SRC" ] || { echo "::error::Could not read the source APK"; exit 1; }
          echo "YouTube $VER"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"
          echo "SRC_APK=$SRC" >> "$GITHUB_ENV"
          echo "YT_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Prepare base options
        run: |
          CLI="$RUNNER_TEMP/morphe-cli.jar"
          java -jar "$CLI" options-create -p "$RUNNER_TEMP/patches.mpp" -p "$RUNNER_TEMP/yavot.mpp" \
            -o "$RUNNER_TEMP/base.json" -f com.google.android.youtube
          [ "$(jq length "$RUNNER_TEMP/base.json")" -eq 2 ] || { echo "::error::Expected 2 patch bundles in the options file"; exit 1; }
          # All YouTube patches (without universal patches)
          java -jar "$CLI" list-patches --patches "$RUNNER_TEMP/patches.mpp" \
            --filter-package-name com.google.android.youtube \
            --with-universal-patches=false --with-descriptions=false \
            | sed -n 's/^Name: //p' | jq -R . | jq -s . > "$RUNNER_TEMP/yt-patches.json"
          echo "YouTube patches: $(jq length "$RUNNER_TEMP/yt-patches.json")"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is not set. Without the signing key, updates cannot be installed over older builds"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/morphe.keystore"

      - name: Build variants
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          # All output goes to a log; on failure the key lines become annotations (visible without signing in)
          LOG="$RUNNER_TEMP/build.log"
          exec > >(tee -a "$LOG") 2>&1
          report() {
            sleep 1
            grep -E "SEVERE|Exception|error|Error|failed|Failed|not found" "$LOG" \
              | grep -v "^::" | tail -n 9 | cut -c1-900 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap report ERR
          BUILD=${{ github.run_number }}
          TAG="v${YT_VERSION}-p${PATCHES_VER}-b${BUILD}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/out"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Build number the update check compares with the published one
          CHECK_BUILD=$BUILD
          # Update info and APK download: R2 when DL_BASE_URL is set. Test uploads use their own names.
          UPD_SUFFIX="" APK_PREFIX=""
          if [ "${{ inputs.r2_test }}" = "true" ]; then
            [ "${{ inputs.publish }}" != "true" ] || { echo "::error::R2 test is for test builds only. Uncheck 'Publish the release'."; exit 1; }
            [ -n "$DL_BASE_URL" ] || { echo "::error::R2 test needs the DL_BASE_URL variable"; exit 1; }
            UPD_SUFFIX="-test" APK_PREFIX="test_"
          fi
          echo "UPD_SUFFIX=$UPD_SUFFIX" >> "$GITHUB_ENV"
          echo "APK_PREFIX=$APK_PREFIX" >> "$GITHUB_ENV"
          # Published APKs are on R2 only, the release links to them
          if [ "${{ inputs.publish }}" = "true" ] && [ -z "$DL_BASE_URL" ]; then
            echo "::error::Publishing needs the DL_BASE_URL variable: the APKs are only on R2"; exit 1
          fi
          if [ "${{ inputs.update_preview }}" = "true" ]; then
            [ "${{ inputs.publish }}" != "true" ] || { echo "::error::Update preview is for test builds only. Uncheck 'Publish the release'."; exit 1; }
            CHECK_BUILD=1
          fi

          # One branding/ folder: mipmap-* (icon), drawable-* (header logo + notification icon)
          ICON=""; HEADER=""
          ls -d branding/mipmap-* >/dev/null 2>&1 && ICON="$GITHUB_WORKSPACE/branding"
          ls branding/drawable-*/morphe_header_custom_*.png >/dev/null 2>&1 && HEADER="$GITHUB_WORKSPACE/branding"

          update_url() {
            if [ -n "$DL_BASE_URL" ]; then echo "$DL_BASE_URL/updates/$1$UPD_SUFFIX.json"
            else echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/updates/$1.json"; fi
          }
          apk_url() {
            if [ -n "$DL_BASE_URL" ]; then echo "$DL_BASE_URL/apk/$APK_PREFIX$1"
            else echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$1"; fi
          }

          # $1 id, $2 file name label, $3 safe file name, $4 package, $5 clone, $6 theme defaults (JSON)
          build_variant() {
            local id=$1 label=$2 safe=$3 pkg=$4 clone=$5 theme=$6
            local opts="$RUNNER_TEMP/options-$id.json"
            local base="YT_Morphe-v${YT_VERSION}-p${PATCHES_VER}"
            # The asset label is the file name, so the release page shows the name of the downloaded file
            local out="$RUNNER_TEMP/out/${base}_${safe}.apk"
            echo "${base}_${label}.apk" > "$out.label"
            local icon="$ICON" header="$HEADER"

            echo "::group::Variant $id ($pkg)"
            jq --slurpfile yt "$RUNNER_TEMP/yt-patches.json" \
               --argjson clone "$clone" --arg pkg "$pkg" \
               --argjson theme "$theme" \
               --arg updurl "$(update_url "$id")" \
               --arg build "$CHECK_BUILD" \
               --arg verinfo "v$YT_VERSION p$PATCHES_VER · Build $BUILD" \
               --arg defaults "$(jq -c . settings/defaults.json)" \
               --arg name "$APP_NAME" --arg icon "$icon" --arg header "$header" '
              def opt($p; $k; $v): if .[0].patches[$p] then .[0].patches[$p].options[$k] = $v
                                   else error("Patch not found: " + $p) end;
              .[0].patches |= with_entries(
                .value.enabled = ((.key as $k | $yt[0] | index($k)) != null
                                  or .key == "Change installer source")
              )
              | .[0].patches["Clone app"].enabled = $clone
              | if $clone then opt("Clone app"; "packageName"; $pkg) else . end
              | opt("Theme"; "darkThemeColor"; "in-app")
              | opt("Theme"; "lightThemeColor"; "in-app")
              | reduce ($theme | to_entries[]) as $e (.; opt("Theme defaults"; $e.key; $e.value))
              | opt("Update checker"; "updateUrl"; $updurl)
              | opt("Update checker"; "buildNumber"; $build)
              | opt("Update checker"; "versionInfo"; $verinfo)
              | opt("Default settings"; "settings"; $defaults)
              # Add-ons (YaVoT): all patches enabled
              | .[range(1; length)].patches |= with_entries(.value.enabled = true)
              | opt("Custom branding"; "customName"; $name)
              | if $icon != "" then opt("Custom branding"; "customIcon"; $icon) else . end
              | if $header != "" then opt("Change header"; "custom"; $header) else . end
            ' "$RUNNER_TEMP/base.json" > "$opts"
            jq -r '.[].patches | to_entries[] | select(.value.enabled) | "  ✓ \(.key)"' "$opts"

            java -jar "$RUNNER_TEMP/morphe-cli.jar" patch \
              -p "$RUNNER_TEMP/patches.mpp" \
              -p "$RUNNER_TEMP/yavot.mpp" \
              --options-file "$opts" \
              --keystore "$RUNNER_TEMP/morphe.keystore" \
              --keystore-password "${KEYSTORE_PASSWORD}" \
              --keystore-entry-alias "${KEY_ALIAS:-Morphe}" \
              --keystore-entry-password "${KEY_PASSWORD:-Morphe}" \
              --striplibs "$STRIPLIBS" \
              --force \
              -t "$RUNNER_TEMP/tmp-$id" \
              -o "$out" \
              "$SRC_APK"

            # Package check: an unpatched or wrong APK is never published
            local actual_pkg
            actual_pkg=$("$AAPT" dump badging "$out" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            echo "Package: $actual_pkg"
            [ "$actual_pkg" = "$pkg" ] || { echo "::error::$id: package $actual_pkg instead of $pkg. Release not published."; exit 1; }

            # Signature check
            local cert
            cert=$("$APKSIGNER" verify --print-certs "$out" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
            echo "Signature: $cert"
            if [ -n "$CERT_SHA256" ]; then
              local expected
              expected=$(echo "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
              [ "$cert" = "$expected" ] || { echo "::error::$id: signature does not match. Release not published."; exit 1; }
            else
              echo "::warning::CERT_SHA256 is not set, signature check skipped"
            fi

            # updates/<id>.json for the in-app update check (kept in the repository)
            local name changelog
            name=$(basename "$out")
            # English from Morphe; other languages from changelog/<language>.md,
            # only if its first line <!-- version --> matches the patches version
            changelog=$(cat "$RUNNER_TEMP/changes.txt")
            local changelogs
            changelogs=$(jq -n --rawfile text "$RUNNER_TEMP/changes.txt" '{en: ($text | rtrimstr("\n"))}')
            for f in changelog/*.md; do
              [ -f "$f" ] || continue
              if [ "$(head -n1 "$f" | tr -d '[:space:]')" != "<!--${PATCHES_VER}-->" ]; then
                echo "::warning::$f is not for version $PATCHES_VER, skipped"
                continue
              fi
              changelogs=$(jq --arg lang "$(basename "$f" .md)" --arg text "$(tail -n +2 "$f")" \
                '. + {($lang): $text}' <<< "$changelogs")
            done
            jq -n \
              --argjson build "$BUILD" --arg variant "$id" --arg pkg "$pkg" \
              --arg yt "$YT_VERSION" --arg patches "$PATCHES_VER" --arg tag "$TAG" \
              --arg apk "$(apk_url "$name")" \
              --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
              --arg forum "$FORUM_URL" --arg changelog "$changelog" \
              --argjson changelogs "$changelogs" \
              --arg sha "$(sha256sum "$out" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$out")" \
              '{build:$build, variant:$variant, package:$pkg, yt_version:$yt, patches:$patches,
                tag:$tag, apk_url:$apk, release_url:$page, forum_url:$forum,
                changelog:$changelog, changelogs:$changelogs, sha256:$sha, size:$size}' \
              > "$RUNNER_TEMP/update-$id.json"
            echo "::endgroup::"
          }

          # Original: dark #0F0F0F and light #F0F0F0 as custom colors, so that the menus get them too
          # (APP_DEFAULT keeps their own color), text in the color of the other theme.
          # Only the defaults change: all theme colors can still be picked in Morphe settings → General.
          build_variant hiby   "Original_Mod_BBK_Clone" "Original_Mod_BBK_Clone" \
            com.hiby.music true \
            '{"darkDefault":"CUSTOM","lightDefault":"CUSTOM","darkCustomDefault":"#0F0F0F","lightCustomDefault":"#F0F0F0","changeForegroundDefault":true}'
          # Amoled: black #000000 / white #FFFFFF (Morphe defaults)
          # Test builds (not published): only the clone variant, which is the one tested
          if [ "${{ inputs.publish }}" != "false" ] && [ -z "${{ inputs.patches_source }}" ]; then
          build_variant morphe "Amoled_Mod"             "Amoled_Mod" \
            app.morphe.android.youtube false \
            '{}'
          fi

      - name: Upload test build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 3

      - name: Upload to R2
        if: ${{ (inputs.publish || inputs.r2_test) && vars.DL_BASE_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [ -n "$R2_ACCOUNT_ID" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$R2_BUCKET" ] \
            || { echo "::error::R2 secrets (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) or the R2_BUCKET variable are not set"; exit 1; }
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          api() { aws s3api --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          # APKs first, so that the update info never points to a missing file
          for f in "$RUNNER_TEMP"/out/*.apk; do
            s3 cp "$f" "s3://$R2_BUCKET/apk/$APK_PREFIX$(basename "$f")" \
              --content-type application/vnd.android.package-archive --only-show-errors
            echo "Uploaded apk/$APK_PREFIX$(basename "$f")"
          done
          for f in "$RUNNER_TEMP"/update-*.json; do
            id=$(basename "$f" .json); id=${id#update-}
            s3 cp "$f" "s3://$R2_BUCKET/updates/$id$UPD_SUFFIX.json" \
              --content-type "application/json; charset=utf-8" --cache-control no-cache --only-show-errors
            echo "Uploaded updates/$id$UPD_SUFFIX.json"
          done
          # Published builds: test files are removed, the APKs of the last 3 builds are kept
          if [ "$PUBLISH" = "true" ]; then
            api list-objects-v2 --bucket "$R2_BUCKET" --prefix apk/ --output json \
              | jq -r '[.Contents // [] | .[] | select(.Key | startswith("apk/test_") | not)]
                       | sort_by(.LastModified) | reverse | .[6:][] | .Key' > "$RUNNER_TEMP/old.txt"
            api list-objects-v2 --bucket "$R2_BUCKET" --output json \
              | jq -r '.Contents // [] | .[] | .Key | select(startswith("apk/test_") or (startswith("updates/") and endswith("-test.json")))' >> "$RUNNER_TEMP/old.txt"
            while IFS= read -r key; do
              [ -n "$key" ] || continue
              s3 rm "s3://$R2_BUCKET/$key" --only-show-errors
              echo "Removed $key"
            done < "$RUNNER_TEMP/old.txt"
          fi

      - name: Publish release
        if: ${{ inputs.publish }}
        run: |
          HIBY=$(basename "$RUNNER_TEMP"/out/*BBK_Clone.apk)
          MORPHE=$(basename "$RUNNER_TEMP"/out/*Amoled_Mod.apk)
          # Recommended settings (settings/defaults.json), imported in Morphe settings → Other → Backup settings
          SETTINGS="YT_Morphe_PRO_Settings_v${PATCHES_VER}.txt"
          jq . settings/defaults.json > "$RUNNER_TEMP/$SETTINGS"
          # The APKs are on R2 only (uploaded in the step before), the release links to them
          apk_link() { echo "[\`$1\`]($DL_BASE_URL/apk/$1)"; }
          {
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "## 📦 Files"
            echo
            echo "| File | Theme |"
            echo "|---|---|"
            echo "| $(apk_link "$MORPHE") | Pure black (/white) by default |"
            echo "| $(apk_link "$HIBY") | Modern dark (/soft light) by default |"
            echo "| \`$SETTINGS\` | Recommended settings |"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/$SETTINGS#$SETTINGS" \
            --title "$APP_TITLE v$YT_VERSION p$PATCHES_VER (Mod)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Publish update info
        if: ${{ inputs.publish }}
        run: |
          mkdir -p updates
          cp "$RUNNER_TEMP/update-hiby.json" updates/hiby.json
          cp "$RUNNER_TEMP/update-morphe.json" updates/morphe.json
          git config user.name "RAMiK4"
          git config user.email "60112744+RAMiK4@users.noreply.github.com"
          git add updates
          git commit -m "Update info for $TAG"
          git pull --rebase -q
          git push
