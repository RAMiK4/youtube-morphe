name: Release YouTube Morphe

on:
  workflow_dispatch:
    inputs:
      patches:
        description: "Патчи Morphe: latest (стабильная), dev (последняя dev) или тег, напр. v1.48.0"
        required: false
        default: "latest"
        type: string
      publish:
        description: "Опубликовать релиз (выкл. — только тестовая сборка в Artifacts)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  YAVOT_REPO: sashade8-ship-it/morphe-patches-yavot
  APP_TITLE: YouTube Morphe
  APP_NAME: YouTube
  STRIPLIBS: arm64-v8a
  FORUM_URL: ""   # ссылка на тему 4PDA

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve patches version
        env:
          CHANNEL: ${{ inputs.patches }}
        run: |
          case "$CHANNEL" in
            ""|latest) TAG=$(gh api "repos/$PATCHES_REPO/releases/latest" -q .tag_name) ;;
            dev)       TAG=$(gh api "repos/$PATCHES_REPO/releases?per_page=30" -q '[.[] | select(.prerelease)][0].tag_name') ;;
            *)         TAG=$(gh api "repos/$PATCHES_REPO/releases/tags/$CHANNEL" -q .tag_name) ;;
          esac
          [ -n "$TAG" ] && [ "$TAG" != null ] || { echo "::error::Не найдена версия патчей '$CHANNEL'"; exit 1; }
          echo "Патчи: $TAG"
          echo "PATCHES_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PATCHES_VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout patches
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PATCHES_REPO }}
          ref: ${{ env.PATCHES_TAG }}
          path: patches-src

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches (official + extras)
        working-directory: patches-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Дополнительные патчи и код из extras/ добавляются к официальным
          cp -rv "$GITHUB_WORKSPACE"/extras/patches/. patches/
          cp -rv "$GITHUB_WORKSPACE"/extras/extensions/. extensions/
          # Строки extras/strings/<locale>/strings.xml дописываются в строки YouTube
          for src in "$GITHUB_WORKSPACE"/extras/strings/*/strings.xml; do
            loc=$(basename "$(dirname "$src")")
            dst="patches/src/main/resources/addresources/$loc/youtube/strings.xml"
            [ -f "$dst" ] || { echo "::error::Нет файла строк $dst"; exit 1; }
            python3 - "$src" "$dst" <<'PY'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          extra = open(src, encoding="utf-8").read()
          text = open(dst, encoding="utf-8").read()
          i = text.rindex("</resources>")
          open(dst, "w", encoding="utf-8").write(text[:i] + extra + text[i:])
          PY
            echo "Строки добавлены: $loc"
          done
          ./gradlew :patches:buildAndroid --no-daemon
          cp patches/build/libs/patches-*.mpp "$RUNNER_TEMP/patches.mpp"

      - name: Download YaVoT add-on
        run: |
          TAG=$(gh api "repos/$YAVOT_REPO/releases/latest" -q .tag_name)
          gh release download "$TAG" -R "$YAVOT_REPO" -p '*.mpp' -D "$RUNNER_TEMP/yavot"
          mv "$RUNNER_TEMP"/yavot/*.mpp "$RUNNER_TEMP/yavot.mpp"
          echo "YaVoT: $TAG"
          echo "YAVOT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download Morphe CLI
        run: |
          gh release download -R MorpheApp/morphe-cli -p 'morphe-desktop-*-all.jar' -D "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP"/cli/*.jar "$RUNNER_TEMP/morphe-cli.jar"

      - name: Download source APK
        run: |
          # Оригинальный APK лежит в черновом (скрытом) релизе с тегом "source"
          mapfile -t URLS < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.tag_name=="source") | .assets[] | select(.name|endswith(".apk")) | .url')
          [ "${#URLS[@]}" -eq 1 ] || { echo "::error::В релизе source должен быть ровно один APK (найдено: ${#URLS[@]})"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          SRC="$RUNNER_TEMP/src/youtube.apk"
          gh api -H "Accept: application/octet-stream" "${URLS[0]}" > "$SRC"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          VER=$("$AAPT" dump badging "$SRC" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [ -n "$VER" ] || { echo "::error::Не удалось определить версию APK"; exit 1; }
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"
          echo "SRC_APK=$SRC" >> "$GITHUB_ENV"
          echo "YT_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Prepare base options
        run: |
          CLI="$RUNNER_TEMP/morphe-cli.jar"
          java -jar "$CLI" options-create -p "$RUNNER_TEMP/patches.mpp" -p "$RUNNER_TEMP/yavot.mpp" \
            -o "$RUNNER_TEMP/base.json" -f com.google.android.youtube
          [ "$(jq length "$RUNNER_TEMP/base.json")" -eq 2 ] || { echo "::error::Ожидалось 2 набора патчей в options"; exit 1; }
          # Все патчи YouTube (без универсальных)
          java -jar "$CLI" list-patches --patches "$RUNNER_TEMP/patches.mpp" \
            --filter-package-name com.google.android.youtube \
            --with-universal-patches=false --with-descriptions=false \
            | sed -n 's/^Name: //p' | jq -R . | jq -s . > "$RUNNER_TEMP/yt-patches.json"
          echo "Патчей YouTube: $(jq length "$RUNNER_TEMP/yt-patches.json")"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Секрет KEYSTORE_B64 не задан — без своего ключа обновление поверх старой версии невозможно"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/morphe.keystore"

      - name: Build variants
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          # Весь вывод в лог; при ошибке ключевые строки выводятся как аннотации (видны без входа)
          LOG="$RUNNER_TEMP/build.log"
          exec > >(tee -a "$LOG") 2>&1
          report() {
            sleep 1
            grep -E "SEVERE|Exception|error|Error|failed|Failed|Нет патча|не найден" "$LOG" \
              | grep -v "^::" | tail -n 9 | cut -c1-900 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap report ERR
          BUILD=${{ github.run_number }}
          TAG="v${YT_VERSION}-p${PATCHES_VER}-b${BUILD}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/out"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # Одна папка branding/: mipmap-* (иконка), drawable-* (логотип в шапке + значок уведомлений)
          ICON=""; HEADER=""
          ls -d branding/mipmap-* >/dev/null 2>&1 && ICON="$GITHUB_WORKSPACE/branding"
          ls branding/drawable-*/morphe_header_custom_*.png >/dev/null 2>&1 && HEADER="$GITHUB_WORKSPACE/branding"

          # $1 id, $2 метка в имени файла, $3 безопасное имя, $4 пакет, $5 clone, $6 цвета по умолчанию (JSON)
          build_variant() {
            local id=$1 label=$2 safe=$3 pkg=$4 clone=$5 theme=$6
            local opts="$RUNNER_TEMP/options-$id.json"
            local base="YouTube_Morphe-v${YT_VERSION}-p${PATCHES_VER}"
            # GitHub заменяет [ ] ( ) + в именах файлов, поэтому имя файла безопасное,
            # а точное имя в формате 4PDA показывается как подпись (label)
            local out="$RUNNER_TEMP/out/${base}_${safe}.apk"
            echo "${base}_${label}.apk" > "$out.label"
            local icon="$ICON" header="$HEADER"

            echo "::group::Вариант $id ($pkg)"
            jq --slurpfile yt "$RUNNER_TEMP/yt-patches.json" \
               --argjson clone "$clone" --arg pkg "$pkg" \
               --argjson theme "$theme" \
               --arg updurl "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/updates/$id.json" \
               --arg build "$BUILD" \
               --arg verinfo "v$YT_VERSION p$PATCHES_VER · Build $BUILD" \
               --arg defaults "$(jq -c . settings/defaults.json)" \
               --arg name "$APP_NAME" --arg icon "$icon" --arg header "$header" '
              def opt($p; $k; $v): if .[0].patches[$p] then .[0].patches[$p].options[$k] = $v
                                   else error("Нет патча: " + $p) end;
              .[0].patches |= with_entries(
                .value.enabled = ((.key as $k | $yt[0] | index($k)) != null
                                  or .key == "Change installer source")
              )
              | .[0].patches["Clone app"].enabled = $clone
              | if $clone then opt("Clone app"; "packageName"; $pkg) else . end
              | opt("Theme"; "darkThemeColor"; "in-app")
              | opt("Theme"; "lightThemeColor"; "in-app")
              | reduce ($theme | to_entries[]) as $e (.; opt("Theme defaults"; $e.key; $e.value))
              | opt("Update checker"; "updateUrl"; $updurl)
              | opt("Update checker"; "buildNumber"; $build)
              | opt("Update checker"; "versionInfo"; $verinfo)
              | opt("Default settings"; "settings"; $defaults)
              # Дополнения (YaVoT): все патчи включены
              | .[range(1; length)].patches |= with_entries(.value.enabled = true)
              | opt("Custom branding"; "customName"; $name)
              | if $icon != "" then opt("Custom branding"; "customIcon"; $icon) else . end
              | if $header != "" then opt("Change header"; "custom"; $header) else . end
            ' "$RUNNER_TEMP/base.json" > "$opts"
            jq -r '.[].patches | to_entries[] | select(.value.enabled) | "  ✓ \(.key)"' "$opts"

            java -jar "$RUNNER_TEMP/morphe-cli.jar" patch \
              -p "$RUNNER_TEMP/patches.mpp" \
              -p "$RUNNER_TEMP/yavot.mpp" \
              --options-file "$opts" \
              --keystore "$RUNNER_TEMP/morphe.keystore" \
              --keystore-password "${KEYSTORE_PASSWORD}" \
              --keystore-entry-alias "${KEY_ALIAS:-Morphe}" \
              --keystore-entry-password "${KEY_PASSWORD:-Morphe}" \
              --striplibs "$STRIPLIBS" \
              --force \
              -t "$RUNNER_TEMP/tmp-$id" \
              -o "$out" \
              "$SRC_APK"

            # Проверка пакета: непропатченный или неверный APK не публикуется
            local actual_pkg
            actual_pkg=$("$AAPT" dump badging "$out" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            echo "Пакет: $actual_pkg"
            [ "$actual_pkg" = "$pkg" ] || { echo "::error::$id: пакет $actual_pkg вместо $pkg. Релиз не опубликован."; exit 1; }

            # Проверка подписи
            local cert
            cert=$("$APKSIGNER" verify --print-certs "$out" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
            echo "Подпись: $cert"
            if [ -n "$CERT_SHA256" ]; then
              local expected
              expected=$(echo "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
              [ "$cert" = "$expected" ] || { echo "::error::$id: подпись не совпадает. Релиз не опубликован."; exit 1; }
            else
              echo "::warning::CERT_SHA256 не задан — проверка подписи пропущена"
            fi

            # updates/<id>.json для проверки обновлений внутри приложения (хранится в репозитории)
            local name changelog
            name=$(basename "$out")
            changelog=$(cat changelog/ru.md 2>/dev/null || true)
            # Все языки: changelog/<язык>.md → {"ru": "...", "en": "..."}
            local changelogs='{}'
            for f in changelog/*.md; do
              [ -f "$f" ] || continue
              changelogs=$(jq --arg lang "$(basename "$f" .md)" --rawfile text "$f" \
                '. + {($lang): ($text | rtrimstr("\n"))}' <<< "$changelogs")
            done
            jq -n \
              --argjson build "$BUILD" --arg variant "$id" --arg pkg "$pkg" \
              --arg yt "$YT_VERSION" --arg patches "$PATCHES_VER" --arg tag "$TAG" \
              --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
              --arg forum "$FORUM_URL" --arg changelog "$changelog" \
              --argjson changelogs "$changelogs" \
              --arg sha "$(sha256sum "$out" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$out")" \
              '{build:$build, variant:$variant, package:$pkg, yt_version:$yt, patches:$patches,
                tag:$tag, apk_url:$apk, release_url:$page, forum_url:$forum,
                changelog:$changelog, changelogs:$changelogs, sha256:$sha, size:$size}' \
              > "$RUNNER_TEMP/update-$id.json"
            echo "::endgroup::"
          }

          # Original: тёмная #0F0F0F (как в YouTube), светлая #F0F0F0, текст цветом другой темы
          build_variant hiby   "[Original+]_Mod_(BBK Clone)" "Original_Mod_BBK_Clone" \
            com.hiby.music true \
            '{"darkDefault":"APP_DEFAULT","lightDefault":"CUSTOM","lightCustomDefault":"#F0F0F0","changeForegroundDefault":true}'
          # Amoled: чёрная #000000 / белая #FFFFFF (значения Morphe по умолчанию)
          build_variant morphe "[Amoled+]_Mod"               "Amoled_Mod" \
            app.morphe.android.youtube false \
            '{}'

      - name: Upload test build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 3

      - name: Publish release
        if: ${{ inputs.publish }}
        run: |
          HIBY=$(cat "$RUNNER_TEMP"/out/*BBK_Clone.apk.label)
          MORPHE=$(cat "$RUNNER_TEMP"/out/*Amoled_Mod.apk.label)
          {
            cat changelog/ru.md 2>/dev/null || true
            if [ -f changelog/en.md ]; then
              echo
              echo "<details><summary>English</summary>"
              echo
              cat changelog/en.md
              echo
              echo "</details>"
            fi
            echo
            echo "| Файл | Пакет |"
            echo "|---|---|"
            echo "| \`$MORPHE\` | \`app.morphe.android.youtube\` |"
            echo "| \`$HIBY\` | \`com.hiby.music\` |"
          } > "$RUNNER_TEMP/notes.md"
          FILES=()
          for f in "$RUNNER_TEMP"/out/*.apk; do FILES+=("$f#$(cat "$f.label")"); done
          gh release create "$TAG" "${FILES[@]}" \
            --title "$APP_TITLE v$YT_VERSION p$PATCHES_VER (Mod)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Publish update info
        if: ${{ inputs.publish }}
        run: |
          mkdir -p updates
          cp "$RUNNER_TEMP/update-hiby.json" updates/hiby.json
          cp "$RUNNER_TEMP/update-morphe.json" updates/morphe.json
          git config user.name "RAMiK4"
          git config user.email "60112744+RAMiK4@users.noreply.github.com"
          git add updates
          git commit -m "Update info for $TAG"
          git pull --rebase -q
          git push
